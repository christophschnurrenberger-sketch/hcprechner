# Erzeugt aus der Beschreibung in docs/ARCHITEKTUR.md – API beider Editionen
openapi: 3.1.0
info:
  title: Golf HCP Rechner – WHS 2026 · API
  version: 2.4.0
  description: 'Schnittstelle zwischen Oberfläche und Backend. Die Oberfläche greift ausschließlich über den API-Adapter

    (`src/lib/api/client.ts`) zu.


    **Node-Edition:** REST-Route-Handler unter `/api/auth`, `/api/me`, `/api/community`, `/api/admin`. Die WHS-Berechnung erfolgt

    auf dem Server über die Service-Schicht `src/lib/member`.


    **Webspace-Edition:** PHP-Skripte `api/auth.php`, `api/me.php`, `api/community.php`, `api/admin.php` (jeweils `?action=…`,

    siehe `x-webspace`). PHP übernimmt Anmeldung, Rollenprüfung, Datentrennung, Speicherung und Audit-Log.

    Die WHS-Berechnung führt der API-Adapter mit derselben Service-Schicht aus, weil PHP kein TypeScript ausführen

    kann. PHP speichert nur strukturgeprüfte Ergebnisse. Die Antworten des Adapters entsprechen den

    hier beschriebenen Strukturen.


    **Sitzung:** signiertes HttpOnly-Cookie `hcp_session` (14 Tage, gleitend, SameSite=Lax, in Produktion Secure).

    Es gibt keine Tokens in localStorage oder sessionStorage. Rolle, Status und Passwortstand werden bei jeder

    Anfrage serverseitig aus der Datenbank bzw. `data/users.php` gelesen.


    **CSRF:** Schreibende Anfragen senden den Header `X-CSRF-Token`. Den Token liefert `GET /api/auth/me`; er ist

    an Konto und Passwortstand gebunden. Die Node-Edition prüft zusätzlich den `Origin`-Header.


    **Fehler:** immer `{ error: CODE, message, fields? }`, Codes siehe `ApiError`.



    **Community (ab 2.2):** alles Opt-in. `/api/community` liefert ausschließlich freigegebene Daten (Projektion im Backend) –

    nie E-Mail-Adressen, interne Benutzer-IDs, private oder ausgeblendete Runden oder nicht freigegebene Notizen. Lochstatistiken

    verändern weder Score Differential noch Handicap Index. Details: docs/COMMUNITY.md.

    '
servers:
- url: http://localhost:3000
  description: Node-Edition (Entwicklung)
tags:
- name: auth
  description: Konto und Anmeldung (öffentlich bzw. angemeldet)
- name: me
  description: Daten des angemeldeten Mitglieds – die Benutzer-ID stammt immer aus der Sitzung
- name: community
  description: Community für angemeldete Mitglieder – nur freigegebene Daten, Filterung im Backend
- name: admin
  description: Admin-Backend – jede Route prüft ihre Berechtigung serverseitig
- name: courses
  description: Öffentliche Golfplatzdaten
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: hcp_session
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 5
        maximum: 200
        default: 25
  responses:
    Error:
      description: Strukturierter Fehler
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - UNAUTHENTICATED
          - SESSION_EXPIRED
          - FORBIDDEN
          - NOT_FOUND
          - VALIDATION
          - CONFLICT
          - RATE_LIMITED
          - SERVER
          - INVALID_CREDENTIALS
          - EMAIL_NOT_VERIFIED
          - ACCOUNT_DISABLED
          - ACCOUNT_LOCKED
          - EMAIL_TAKEN
          - REGISTRATION_CLOSED
          - TOKEN_INVALID
          - COURSE_NOT_FOUND
          - COURSE_RATING_MISSING
          - RATING_NOT_VERIFIED
          - RATING_CHANGED
          - NINE_HOLE_RATING_MISSING
          - HOLE_DATA_MISSING
          - ROUND_NOT_FOUND
          - ROUND_INVALID
          - COMMUNITY_DISABLED
          - MEMBER_NOT_FOUND
        message:
          type: string
          description: Verständliche deutsche Meldung
        fields:
          type: object
          additionalProperties:
            type: string
          description: Meldungen je Eingabefeld
    Role:
      type: string
      enum:
      - USER
      - SUPPORT
      - ADMIN
      - SUPER_ADMIN
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - DISABLED
      - LOCKED
    SessionUser:
      type: object
      properties:
        id:
          type: string
        email:
          type:
          - string
          - 'null'
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string
          description: Rechte der Rolle (vom Server)
        emailVerified:
          type: boolean
        mustChangePassword:
          type: boolean
        onboarded:
          type: boolean
    PublicSettings:
      type: object
      properties:
        siteName:
          type: string
        registrationOpen:
          type: boolean
        emailVerificationRequired:
          type: boolean
        imprintText:
          type:
          - string
          - 'null'
        privacyText:
          type:
          - string
          - 'null'
        contactEmail:
          type:
          - string
          - 'null'
        community:
          $ref: '#/components/schemas/CommunityFlags'
    MeResponse:
      type: object
      properties:
        installed:
          type: boolean
        user:
          oneOf:
          - $ref: '#/components/schemas/SessionUser'
          - type: 'null'
        csrf:
          type:
          - string
          - 'null'
        settings:
          $ref: '#/components/schemas/PublicSettings'
        appVersion:
          type: string
    RoundInput:
      type: object
      description: Eingabe des Runden-Wizards. Bei Plätzen aus der Datenbank löst das Backend Par, Course Rating, Slope und Lochdaten selbst auf
        (zum Spieldatum gültiges, geprüftes Rating) – Werte des Clients werden dafür nicht verwendet. 9-Loch-Ratings werden nie aus 18-Loch-Ratings
        abgeleitet.
      required:
      - date
      - category
      - course
      - holes
      - score
      properties:
        date:
          type: string
          format: date
        title:
          type: string
        category:
          type: string
          enum:
          - TOURNAMENT
          - RPR
          - OTHER
        holes:
          type: integer
          enum:
          - 9
          - 18
        nine:
          type:
          - string
          - 'null'
          enum:
          - FRONT
          - BACK
          - null
        pcc:
          type: integer
          enum:
          - -1
          - 0
          - 1
          - 2
          - 3
        notes:
          type: string
        course:
          oneOf:
          - type: object
            required:
            - kind
            - courseId
            - layoutId
            - teeColor
            - gender
            properties:
              kind:
                const: DB
              courseId:
                type: string
              layoutId:
                type: string
              teeColor:
                type: string
              gender:
                type: string
                enum:
                - M
                - F
              confirmRating:
                type: object
                description: Nur bei ungeprüftem Rating – vom Spieler mit der Scorekarte bestätigte Werte; müssen exakt mit dem hinterlegten Rating
                  übereinstimmen (sonst RATING_CHANGED).
                required:
                - par
                - courseRating
                - slopeRating
                properties:
                  par:
                    type: integer
                  courseRating:
                    type: number
                  slopeRating:
                    type: integer
          - type: object
            required:
            - kind
            - courseName
            - gender
            - par
            - courseRating
            - slopeRating
            description: Werte von der offiziellen Scorekarte (Ausland, ungeprüfte Ratings)
            properties:
              kind:
                const: MANUAL
              courseName:
                type: string
              city:
                type:
                - string
                - 'null'
              teeColor:
                type:
                - string
                - 'null'
              gender:
                type: string
                enum:
                - M
                - F
              par:
                type: integer
              courseRating:
                type: number
              slopeRating:
                type: integer
                minimum: 55
                maximum: 155
          - type: 'null'
        score:
          oneOf:
          - type: object
            properties:
              mode:
                const: GBE
              adjustedGrossScore:
                type: integer
          - type: object
            properties:
              mode:
                const: HOLES
              strokes:
                type: array
                items:
                  oneOf:
                  - type: integer
                  - const: PICKUP
                  - type: 'null'
          - type: object
            properties:
              mode:
                const: STABLEFORD_TOTAL
              points:
                type: integer
        visibility:
          $ref: '#/components/schemas/RoundVisibility'
        holeStats:
          type:
          - array
          - 'null'
          minItems: 9
          maxItems: 18
          items:
            $ref: '#/components/schemas/HoleStat'
          description: Optionale Lochstatistik (Spielleistung, ohne Einfluss aufs Handicap). Bei Eingabe „Loch für Loch“ übernimmt das Backend
            die Schläge aus der WHS-Eingabe, Par/Handicap aus den Platzdaten. null entfernt eine bisherige Statistik, fehlend = unverändert.
    RoundListItem:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        courseName:
          type: string
        holes:
          type: integer
        adjustedGrossScore:
          type:
          - integer
          - 'null'
        scoreDifferential:
          type:
          - number
          - 'null'
        adjustedScoreDifferential:
          type:
          - number
          - 'null'
        handicapIndexBefore:
          type: number
        handicapIndexAfter:
          type:
          - number
          - 'null'
        relevant:
          type: boolean
        counted:
          type: boolean
        note:
          type:
          - string
          - 'null'
    HcpResult:
      type: object
      description: Handicap Index mit Rechenweg (Auszug)
      properties:
        status:
          type: string
          enum:
          - INITIAL
          - ACTIVE
        currentHandicapIndex:
          type: number
        calculatedHandicapIndex:
          type:
          - number
          - 'null'
        startHandicapIndex:
          type: number
        lowHandicapIndex:
          type:
          - number
          - 'null'
        scoringRecordCount:
          type: integer
        usedCount:
          type:
          - integer
          - 'null'
        calculationLabel:
          type: string
          examples:
          - Durchschnitt der besten 4 von 12 Score Differentials
        countedScoreDifferentials:
          type: array
          items:
            type: object
        deviation:
          type:
          - object
          - 'null'
        changeSinceLastRound:
          type:
          - object
          - 'null'
        history:
          type: array
          items:
            type: object
        record:
          type: array
          items:
            $ref: '#/components/schemas/RoundListItem'
    RoundPreview:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/RoundListItem'
        result:
          type: object
          description: Vollständiges Rechenergebnis (Score Differential
          GBE je Loch: null
          Relevanz): null
        hcpBefore:
          type: number
        hcpAfter:
          type: number
        changed:
          type: boolean
        issues:
          type: array
          items:
            type: string
        blocking:
          type: boolean
    RoundSaveResult:
      allOf:
      - $ref: '#/components/schemas/RoundPreview'
      - type: object
        properties:
          roundId:
            type: string
    AdminUserRow:
      type: object
      properties:
        id:
          type: string
        email:
          type:
          - string
          - 'null'
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type:
          - string
          - 'null'
          format: date-time
        lastActivityAt:
          type:
          - string
          - 'null'
          format: date-time
        rounds:
          type: integer
    AuditEntry:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        action:
          type: string
        actorId:
          type:
          - string
          - 'null'
        actorName:
          type:
          - string
          - 'null'
        userId:
          type:
          - string
          - 'null'
        entityType:
          type:
          - string
          - 'null'
        entityId:
          type:
          - string
          - 'null'
        oldValue: {}
        newValue: {}
    Page:
      type: object
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    CommunityFlags:
      type: object
      description: Schalter des Betreibers (Admin → Einstellungen)
      properties:
        communityEnabled:
          type: boolean
        rankingEnabled:
          type: boolean
        publicRoundsEnabled:
          type: boolean
        statsSharingEnabled:
          type: boolean
        activityFeedEnabled:
          type: boolean
    RoundVisibility:
      type: string
      enum:
      - PRIVATE
      - MEMBERS_BASIC
      - MEMBERS_FULL
      default: PRIVATE
      description: Nur ich · Alle Mitglieder – Basisdaten · Alle Mitglieder – Details (Scorekarte/Statistik, setzt Statistik-Freigabe voraus)
    HoleStat:
      type: object
      required:
      - number
      description: Lochdaten; null = nicht erfasst. FIR nur auf Par 4/5. Unmögliche Kombinationen (z. B. mehr Putts als Schläge) → VALIDATION.
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 18
        par:
          type:
          - integer
          - 'null'
        strokeIndex:
          type:
          - integer
          - 'null'
        score:
          type:
          - integer
          - 'null'
        putts:
          type:
          - integer
          - 'null'
        fir:
          type:
          - boolean
          - 'null'
        gir:
          type:
          - boolean
          - 'null'
        bunkerVisit:
          type:
          - boolean
          - 'null'
        bunkerShots:
          type:
          - integer
          - 'null'
        sandSave:
          type:
          - boolean
          - 'null'
        upAndDown:
          type:
          - boolean
          - 'null'
        penaltyStrokes:
          type:
          - integer
          - 'null'
        note:
          type:
          - string
          - 'null'
          maxLength: 200
          description: privat, außer bei ausdrücklicher Notiz-Freigabe
    RoundStatistics:
      type: object
      description: Vom Backend berechnet. Quoten 0–100 ungerundet; null = keine Versuche. Nenner = erfasste Löcher.
      properties:
        holes:
          type: integer
        holesScored:
          type: integer
        holesTracked:
          type: integer
        puttHoles:
          type: integer
        girs:
          type: integer
        girHoles:
          type: integer
        firs:
          type: integer
        fairwayOpportunities:
          type: integer
        sandAttempts:
          type: integer
        sandSaves:
          type: integer
        upAndDownAttempts:
          type: integer
        upAndDowns:
          type: integer
        threePutts:
          type: integer
        eagles:
          type: integer
        birdies:
          type: integer
        pars:
          type: integer
        bogeys:
          type: integer
        doubleBogeys:
          type: integer
        triplePlus:
          type: integer
        grossScore:
          type:
          - number
          - 'null'
        parPlayed:
          type:
          - number
          - 'null'
        totalPutts:
          type:
          - number
          - 'null'
        puttsPerHole:
          type:
          - number
          - 'null'
        puttsOnGir:
          type:
          - number
          - 'null'
        puttsPerGir:
          type:
          - number
          - 'null'
        girPercentage:
          type:
          - number
          - 'null'
        firPercentage:
          type:
          - number
          - 'null'
        sandSavePercentage:
          type:
          - number
          - 'null'
        upAndDownPercentage:
          type:
          - number
          - 'null'
        penaltyStrokes:
          type:
          - number
          - 'null'
        scorecardComplete:
          type: boolean
    PerformanceReport:
      type: object
      description: Golfstatistik mehrerer Runden (Summen der Treffer ÷ Summen der Versuche, nie Durchschnitt von Prozentwerten)
      properties:
        filter:
          type: object
        summary:
          type: object
          description: 'PerformanceSummary: Quoten, Durchschnitte 9/18, Verteilung'
        history:
          type: array
          items:
            type: object
            description: PerformancePoint je Runde
        options:
          type: object
          description: gespielte Plätze und Abschläge
        roundsWithoutStats:
          type: integer
    CommunitySettings:
      type: object
      description: Alles standardmäßig aus (Opt-in). Runden/Statistik setzen ein sichtbares Profil voraus, Notizen zusätzlich Runden- und Statistik-Freigabe.
      properties:
        displayName:
          type:
          - string
          - 'null'
          description: 2–40 Zeichen, keine E-Mail-Adressen oder Links; null = „Vorname N.“
        rankingVisible:
          type: boolean
          default: false
        profileVisible:
          type: boolean
          default: false
        roundsVisible:
          type: boolean
          default: false
        statsVisible:
          type: boolean
          default: false
        notesVisible:
          type: boolean
          default: false
        defaultRoundVisibility:
          $ref: '#/components/schemas/RoundVisibility'
        publicId:
          type:
          - string
          - 'null'
        avatarVersion:
          type:
          - integer
          - 'null'
        updatedAt:
          type:
          - string
          - 'null'
    MyCommunity:
      type: object
      properties:
        settings:
          $ref: '#/components/schemas/CommunitySettings'
        effectiveDisplayName:
          type: string
        avatarUrl:
          type:
          - string
          - 'null'
        flags:
          $ref: '#/components/schemas/CommunityFlags'
    PublicMemberRef:
      type: object
      description: Öffentlicher Verweis – enthält nie E-Mail oder interne ID
      properties:
        publicId:
          type: string
        displayName:
          type: string
        initials:
          type: string
        avatarUrl:
          type:
          - string
          - 'null'
        profileVisible:
          type: boolean
    MyRanking:
      type: object
      properties:
        participating:
          type: boolean
        position:
          type:
          - integer
          - 'null'
          description: 'bei Nicht-Teilnahme: nur für dich berechnet'
        handicapIndex:
          type: number
        trend:
          type:
          - integer
          - 'null'
        trendSince:
          type:
          - string
          - 'null'
        total:
          type: integer
    RankingEntry:
      allOf:
      - $ref: '#/components/schemas/PublicMemberRef'
      - type: object
        properties:
          position:
            type: integer
            description: Wettkampf-Rang (1, 1, 3)
          handicapIndex:
            type: number
          homeCourseName:
            type:
            - string
            - 'null'
          roundsCount:
            type: integer
          trend:
            type:
            - integer
            - 'null'
            description: + = Plätze gewonnen seit dem letzten Ranking-Stand
          isMe:
            type: boolean
    RankingResponse:
      type: object
      properties:
        scope:
          type: string
          enum:
          - ALL
          - HOME
          - REGION
        scopeLabel:
          type:
          - string
          - 'null'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/RankingEntry'
        top:
          type: array
          items:
            $ref: '#/components/schemas/RankingEntry'
        me:
          oneOf:
          - $ref: '#/components/schemas/MyRanking'
          - type: 'null'
        scopes:
          type: array
          items:
            type: object
        previousSnapshotDate:
          type:
          - string
          - 'null'
    PublicRoundSummary:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/PublicMemberRef'
        roundId:
          type: string
        level:
          type: string
          enum:
          - BASIC
          - FULL
        date:
          type: string
          format: date
        courseName:
          type: string
        holes:
          type: integer
          enum:
          - 9
          - 18
        grossScore:
          type:
          - integer
          - 'null'
        adjustedGrossScore:
          type:
          - integer
          - 'null'
        scoreDifferential:
          type:
          - number
          - 'null'
        handicapIndexAfter:
          type:
          - number
          - 'null'
        createdAt:
          type: string
    PublicRoundView:
      allOf:
      - $ref: '#/components/schemas/PublicRoundSummary'
      - type: object
        description: 'Stufe BASIC: stats/holeStats/notes = null'
        properties:
          stats:
            oneOf:
            - $ref: '#/components/schemas/RoundStatistics'
            - type: 'null'
          holeStats:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/HoleStat'
          insights:
            type: array
            items:
              type: string
          notes:
            type:
            - string
            - 'null'
          isMine:
            type: boolean
    PublicProfileView:
      allOf:
      - $ref: '#/components/schemas/PublicMemberRef'
      - type: object
        properties:
