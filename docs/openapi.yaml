      type: object
      description: WGS-84-Koordinate in Dezimalgrad
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    GreenGeo:
      type: object
      description: Grün eines Lochs – unabhängig vom Abschlag. MVP ist die Mitte; Front/Back optional, Grünfläche und
        Fahne vorbereitet. Fehlende Werte sind null (nie geschätzt).
      properties:
        front:
          oneOf:
          - $ref: '#/components/schemas/GeoPoint'
          - type: 'null'
        center:
          oneOf:
          - $ref: '#/components/schemas/GeoPoint'
          - type: 'null'
        back:
          oneOf:
          - $ref: '#/components/schemas/GeoPoint'
          - type: 'null'
        polygon:
          type:
          - object
          - 'null'
          description: GeoJSON-Polygon (Ringe aus [Länge, Breite]) – vorbereitet
        pin:
          type:
          - object
          - 'null'
          description: Fahnenposition mit Zeitpunkt (latitude, longitude, setAt) – vorbereitet
