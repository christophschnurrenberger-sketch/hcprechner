        tees:
          type: array
          description: Abschlagpositionen je Farbe (vorbereitet)
          items:
            type: object
            properties:
              teeColor:
                type: string
              latitude:
                type: number
              longitude:
                type: number
        source:
          type:
          - string
          - 'null'
          enum:
          - MANUAL
          - DEVICE_GPS
          - CSV_IMPORT
          - MAP
          - null
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
paths:
  /api/auth/me:
    get:
      tags:
      - auth
      summary: Sitzung, CSRF-Token und öffentliche Einstellungen
      x-webspace: GET api/auth.php?action=me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
  /api/auth/login:
    post:
      tags:
      - auth
      summary: Anmelden (E-Mail oder Benutzername älterer Konten)
      description: Begrenzt auf 10 Fehlversuche je Anschluss und 8 je Konto in 15 Minuten. Gleiche Antwort und Laufzeit für falsches Passwort
        und unbekanntes Konto.
      x-webspace: POST api/auth.php?action=login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Angemeldet
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/SessionUser'
                  csrf:
                    type: string
        '401': &id001
          $ref: '#/components/responses/Error'
        '403':
          description: EMAIL_NOT_VERIFIED, ACCOUNT_DISABLED, ACCOUNT_LOCKED
        '429': *id001
  /api/auth/logout:
    post:
      tags:
      - auth
      summary: Abmelden
      x-webspace: POST api/auth.php?action=logout
      responses:
        '200':
          description: OK
  /api/auth/register:
    post:
      tags:
      - auth
      summary: Registrieren – die Rolle ist immer USER
      x-webspace: POST api/auth.php?action=register
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - firstName
              - lastName
              - email
              - password
              - passwordRepeat
              - acceptTerms
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                passwordRepeat:
                  type: string
                handicapIndex:
                  type:
                  - string
                  - number
                  - 'null'
                  description: Start-HCPI, Dezimalkomma erlaubt (−10 bis 54)
                acceptTerms:
                  const: true
      responses:
        '201':
          description: verificationRequired=true (E-Mail verschickt) oder angemeldet
        '400': *id001
        '403':
          description: REGISTRATION_CLOSED
        '409':
          description: EMAIL_TAKEN
  /api/auth/verify-email:
    post:
      tags:
      - auth
      summary: E-Mail-Adresse bestätigen (Token aus der E-Mail, 48 Stunden gültig)
      x-webspace: POST api/auth.php?action=verify-email
      responses:
        '200':
          description: OK
        '400':
          description: TOKEN_INVALID
  /api/auth/resend-verification:
    post:
      tags:
      - auth
      summary: Bestätigungslink erneut senden – Antwort immer gleich
      x-webspace: POST api/auth.php?action=resend-verification
      responses:
        '200':
          description: OK
  /api/auth/forgot-password:
    post:
      tags:
      - auth
      summary: Link zum Zurücksetzen anfordern (1 Stunde gültig) – Antwort immer gleich
      x-webspace: POST api/auth.php?action=forgot-password
      responses:
        '200':
          description: OK
  /api/auth/reset-password:
    post:
      tags:
      - auth
      summary: Neues Passwort mit Token – meldet alle Geräte ab
      x-webspace: POST api/auth.php?action=reset-password
      responses:
        '200':
          description: OK
        '400':
          description: TOKEN_INVALID oder VALIDATION
  /api/auth/change-password:
    post:
      tags:
      - auth
      summary: Passwort ändern
      security: &id002
      - session: []
        csrf: []
      x-webspace: POST api/auth.php?action=change-password
      responses:
        '200':
          description: Neue Sitzung und neuer CSRF-Token
  /api/auth/update-profile:
    post:
      tags:
      - auth
      summary: Name und E-Mail ändern – neue E-Mail gilt erst nach Bestätigung
      security: *id002
      x-webspace: POST api/auth.php?action=update-profile
      responses:
        '200':
          description: OK
  /api/auth/export:
    post:
      tags:
      - auth
      summary: 'Datenauskunft: Konto und gespeicherte Daten ohne Hashes'
      security: *id002
      x-webspace: POST api/auth.php?action=export
      responses:
        '200':
          description: OK
  /api/auth/delete-account:
    post:
      tags:
      - auth
      summary: Eigenes Konto löschen (Passwort und Bestätigung „LÖSCHEN“)
      security: *id002
      x-webspace: POST api/auth.php?action=delete-account
      responses:
        '200':
          description: OK
        '409':
          description: letztes Super-Admin-Konto
  /api/me:
    get:
      tags:
      - me
      summary: Profil und Vorlieben
      security: &id003
      - session: []
      x-webspace: GET api/me.php?action=load – der Adapter bildet die Antwort aus dem Dokument
      responses:
        '200':
          description: MemberProfileData
  /api/me/dashboard:
    get:
      tags:
      - me
      summary: Dashboard
      security: *id003
      responses:
        '200':
          description: DashboardData
  /api/me/hcp:
    get:
      tags:
      - me
      summary: Handicap Index mit Rechenweg und Verlauf
      security: *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HcpResult'
  /api/me/rounds:
    get:
      tags:
      - me
      summary: Runden ohne gelöschte
      security: *id003
      parameters:
      - name: holes
        in: query
        schema:
          type: integer
          enum:
          - 9
          - 18
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoundListItem'
    post:
      tags:
      - me
      summary: Runde speichern (Audit ROUND_CREATED) – mit draftId idempotent
      description: 'Mit `draftId` (Entwurfs-ID, `[A-Za-z0-9_-]{1,64}`) ist das Speichern idempotent: Wurde aus diesem
        Entwurf bereits eine Runde gespeichert (z. B. Wiederholung nach Verbindungsabbruch der mobilen Scorecard), entsteht
        keine zweite Runde – die Antwort ist 200 mit dem Ergebnis der vorhandenen Runde, ohne zweiten Audit-Eintrag. Die
        Kennung wird als `clientRef` an der Runde gespeichert.'
      security: *id002
      x-webspace: 'POST api/me.php?action=round-save mit round (inkl. clientRef), draftId und baseRevision; kennt PHP die
        clientRef schon, antwortet es mit { duplicate: true, roundId } und legt nichts an'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  $ref: '#/components/schemas/RoundInput'
                draftId:
                  type:
                  - string
                  - 'null'
      responses:
        '201':
          description: Neu gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundSaveResult'
        '200':
          description: Bereits aus diesem Entwurf gespeichert – Ergebnis der vorhandenen Runde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundSaveResult'
        '400':
          description: VALIDATION, RATING_NOT_VERIFIED, RATING_CHANGED, NINE_HOLE_RATING_MISSING, COURSE_RATING_MISSING, HOLE_DATA_MISSING, ROUND_INVALID
  /api/me/rounds/preview:
    post:
      tags:
      - me
      summary: Vorschau „Dein Ergebnis“ – wird nicht gespeichert
      security: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundPreview'
  /api/me/rounds/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - me
      summary: Rundendetail mit Rechenweg
      security: *id003
      responses:
        '200':
          description: RoundDetail
        '404':
          description: ROUND_NOT_FOUND – auch für Runden anderer Mitglieder
    put:
      tags:
      - me
      summary: Runde ändern – der Verlauf wird chronologisch neu berechnet (Audit ROUND_MODIFIED)
      security: *id002
      responses:
        '200':
          description: RoundSaveResult
    delete:
      tags:
      - me
      summary: Soft Delete (Audit ROUND_DELETED)
      security: *id002
      x-webspace: POST api/me.php?action=round-delete
      responses:
        '200':
          description: OK
  /api/me/profile:
    put:
      tags:
      - me
      summary: Start-HCPI und Geschlecht
      security: *id002
      x-webspace: POST api/me.php?action=profile-save
      responses:
        '200':
          description: MemberProfileData
  /api/me/onboarding:
    post:
      tags:
      - me
      summary: Onboarding abschließen (Start-HCPI, Heimatplatz)
      security: *id002
      responses:
        '200':
          description: MemberProfileData
  /api/me/courses:
    get:
      tags:
      - me
      summary: Favoriten, Heimatplatz, zuletzt gespielt
      security: *id003
      responses:
        '200':
          description: MemberCourseLists
  /api/me/favorites/{courseId}:
    put:
      tags:
      - me
      summary: Favorit setzen oder entfernen
      security: *id002
      x-webspace: POST api/me.php?action=prefs-save
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: MemberPreferences
  /api/me/home-course:
    put:
      tags:
      - me
      summary: Heimatplatz festlegen
      security: *id002
      x-webspace: POST api/me.php?action=prefs-save
      responses:
        '200':
          description: MemberPreferences
  /api/me/preferences:
    put:
      tags:
      - me
      summary: Einstellungen der mobilen Scorecard (Profil → Rundeneingabe, Distanz)
      description: Mindestens eines der Felder. distanceUnit (seit 2.4) ist die Einheit der Entfernung zum Grün.
      security: *id002
      x-webspace: POST api/me.php?action=prefs-save mit preferences.roundEntryMode bzw. preferences.distanceUnit
      requestBody:
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                roundEntryMode:
                  type: string
                  enum:
                  - ASK
                  - QUICK
                  - DETAILED
                distanceUnit:
                  type: string
                  enum:
                  - M
                  - YD
                  default: M
      responses:
        '200':
          description: MemberPreferences (favorites, homeCourseId, roundEntryMode, distanceUnit)
        '400':
          description: VALIDATION
  /api/me/drafts:
    get:
      tags:
      - me
      summary: Entwürfe (nicht abgeschlossene Runden)
      security: *id003
      responses:
        '200':
          description: Liste von DraftRound
  /api/me/drafts/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    put:
      tags:
      - me
      summary: Entwurf speichern (automatisch, höchstens 10)
      security: *id002
      x-webspace: POST api/me.php?action=draft-save
      responses:
        '200':
          description: DraftRound
    delete:
      tags:
      - me
      summary: Entwurf verwerfen
      security: *id002
      x-webspace: POST api/me.php?action=draft-delete
      responses:
        '200':
          description: OK
  /api/me/import/preview:
    post:
      tags:
      - me
      summary: CSV-Import prüfen
      security: *id002
      responses:
        '200':
          description: ImportPreview
  /api/me/import:
    post:
      tags:
      - me
      summary: CSV-Import übernehmen (Audit ROUNDS_IMPORTED)
      security: *id002
      x-webspace: POST api/me.php?action=rounds-import
      responses:
        '200':
          description: imported und skipped
  /api/me/rounds/{id}/stats:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    put:
      tags:
      - me
      summary: Lochstatistik ergänzen/ändern – GBE, Score Differential und HCPI bleiben unverändert (Audit ROUND_STATS_UPDATED)
      security: *id002
      x-webspace: POST api/me.php?action=round-stats-save
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                holeStats:
                  type:
                  - array
                  - 'null'
                  items:
                    $ref: '#/components/schemas/HoleStat'
      responses:
        '200':
          description: '{ stats: RoundStatistics | null, warnings: string[] }'
        '400': *id001
        '404': *id001
  /api/me/rounds/{id}/visibility:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    patch:
      tags:
      - me
      summary: Sichtbarkeit einer Runde (Audit ROUND_VISIBILITY_CHANGED)
      security: *id002
      x-webspace: POST api/me.php?action=round-visibility
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - visibility
              properties:
                visibility:
                  $ref: '#/components/schemas/RoundVisibility'
      responses:
        '200':
          description: OK
        '404': *id001
  /api/me/statistics:
    get:
      tags:
      - me
      summary: Golfstatistik (Spielleistung) mit Filtern – seit 2.2; die WHS-Auswertung liegt unter /api/me/tools/statistics
      security: *id003
      x-webspace: 'Adapter: berechnet aus dem eigenen Dokument (api/me.php?action=load)'
      parameters:
      - name: last
        in: query
        schema:
          type: integer
          enum:
          - 5
          - 10
          - 20
        description: letzte n Runden mit Statistik; fehlt = alle
      - name: holes
        in: query
        schema:
          type: integer
          enum:
          - 9
          - 18
      - name: courseId
        in: query
        schema:
          type: string
      - name: teeColor
        in: query
        schema:
          type: string
      - name: period
        in: query
        schema:
          type: string
          enum:
          - ALL
          - DAYS_30
          - DAYS_90
          - YEAR
      responses:
        '200':
          description: PerformanceReport
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceReport'
  /api/me/statistics/history:
    get:
      tags:
      - me
      summary: Verlauf je Runde (gleiche Filter wie /api/me/statistics)
      security: *id003
      responses:
        '200':
          description: PerformancePoint[]
  /api/me/tools/statistics:
    get:
      tags:
      - me
      summary: WHS-Auswertung der Score Differentials (bis 2.1 unter /api/me/statistics)
      security: *id003
      responses:
        '200':
          description: PlayerStatistics
  /api/me/community:
    get:
      tags:
      - me
      summary: Eigene Community- und Privatsphäre-Einstellungen
      security: *id003
      x-webspace: GET api/community.php?action=my
      responses:
        '200':
          description: MyCommunity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyCommunity'
    patch:
      tags:
      - me
      summary: Einstellungen ändern (nur eigene; Audit COMMUNITY_SETTINGS_CHANGED)
      security: *id002
      x-webspace: POST api/me.php?action=community-save
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Teilmenge von CommunitySettings (displayName, *Visible, defaultRoundVisibility)
      responses:
        '200':
          description: MyCommunity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyCommunity'
        '400': *id001
  /api/me/avatar:
    put:
      tags:
      - me
      summary: Profilbild speichern (Data-URL JPEG/PNG/WebP, höchstens 150 KB; Dateiinhalt wird geprüft)
      security: *id002
      x-webspace: POST api/me.php?action=avatar-save
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - dataUrl
              properties:
                dataUrl:
                  type: string
      responses:
        '200':
          description: MyCommunity
        '400': *id001
    delete:
      tags:
      - me
      summary: Profilbild entfernen
      security: *id002
      x-webspace: POST api/me.php?action=avatar-delete
      responses:
        '200':
          description: MyCommunity
  /api/me/ranking:
    get:
      tags:
      - me
      summary: Eigene Ranking-Position und Verlauf
      security: *id003
      x-webspace: GET api/community.php?action=my-ranking
      responses:
        '200':
          description: '{ ranking: MyRanking | null, history: { date, position, handicapIndex }[] }'
  /api/me/tools/{tool}:
    post:
      tags:
      - me
      summary: 'Werkzeuge: simulate (scoreDifferential), target (target), gbe (Scorekarte)'
      security: *id002
      parameters:
      - name: tool
        in: path
        required: true
        schema:
          type: string
          enum:
          - simulate
          - target
          - gbe
      responses:
        '200':
          description: OK
  /api/community/ranking:
    get:
      tags:
      - community
      summary: Ranking nach Handicap Index – nur Mitglieder mit Zustimmung; Nicht-Teilnehmer sehen ihre hypothetische Position nur selbst
      security: *id003
      x-webspace: GET api/community.php?action=ranking
      parameters:
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - ALL
          - HOME
          - REGION
      - &id004
        name: page
        in: query
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: RankingResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingResponse'
        '403': *id001
  /api/community/members:
    get:
      tags:
      - community
      summary: Mitglieder mit sichtbarem Profil
      security: *id003
      x-webspace: GET api/community.php?action=members
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 60
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - HCP
          - NAME
          - ACTIVITY
      - *id004
      responses:
        '200':
          description: CommunityPage<MemberListItem>
        '403': *id001
  /api/community/members/{publicId}:
    parameters:
    - name: publicId
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - community
      summary: Öffentliches Profil (nur mit Profil-Freigabe; sonst MEMBER_NOT_FOUND)
      security: *id003
      x-webspace: GET api/community.php?action=member&id=
      responses:
        '200':
          description: PublicProfileView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfileView'
        '404': *id001
  /api/community/members/{publicId}/rounds:
    parameters:
    - name: publicId
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - community
      summary: Freigegebene Runden eines Mitglieds
      security: *id003
      x-webspace: GET api/community.php?action=member-rounds&id=
      parameters:
      - *id004
      responses:
        '200':
          description: CommunityPage<PublicRoundSummary>
        '404': *id001
  /api/community/activity:
    get:
      tags:
      - community
      summary: Zuletzt freigegebene Runden
      security: *id003
      x-webspace: GET api/community.php?action=activity
      parameters:
      - *id004
      responses:
        '200':
          description: 'CommunityPage<{ type: ROUND, round: PublicRoundSummary }>'
        '403': *id001
  /api/community/rounds/{publicId}/{roundId}:
    parameters:
    - name: publicId
      in: path
      required: true
      schema:
        type: string
    - name: roundId
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - community
      summary: Freigegebene Runde (BASIC oder FULL) – private, gelöschte oder ausgeblendete Runden → 404
      security: *id003
      x-webspace: GET api/community.php?action=round&member=&round=
      responses:
        '200':
          description: PublicRoundView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRoundView'
        '404': *id001
  /api/community/avatar/{publicId}:
    parameters:
    - name: publicId
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - community
      summary: Profilbild (nur angemeldet; nur bei Profil- oder Ranking-Freigabe)
      security: *id003
      x-webspace: GET api/community.php?action=avatar&id=
      responses:
        '200':
          description: Bild
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '404':
          description: kein Bild oder nicht freigegeben
  /api/courses:
    get:
      tags:
      - courses
      summary: Golfplatzsuche (q, region, plz, has9, has18, tee, verified, limit)
      x-webspace: GET api/courses.php liefert den Datensatz; die Suche läuft im Browser mit derselben Logik
      responses:
        '200':
          description: CourseSearchResponse
  /api/courses/{id}:
    get:
      tags:
      - courses
      summary: Anlage mit Plätzen, Ratings (Quelle, Prüfstatus, Gültigkeit), Lochdaten und GPS-Grünkoordinaten
      description: Seit 2.4 enthält jedes Layout `holeGeo` (leer, wenn keine Koordinaten erfasst sind). Die Entfernung
        zum Grün berechnet ausschließlich das Gerät; es gibt keinen Endpunkt, der Standorte entgegennimmt.
      x-webspace: GET api/courses.php liefert den Datensatz (schemaVersion 2) mit derselben Struktur
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: CourseDto (Auszug)
          content:
            application/json:
              schema:
                type: object
                properties:
                  layouts:
                    type: array
                    items:
                      type: object
                      properties:
                        holeGeo:
                          type: array
                          items:
                            $ref: '#/components/schemas/HoleGeo'
  /api/admin/stats:
    get:
      tags:
      - admin
      summary: Kennzahlen und letzte Aktionen
      description: 'Berechtigung: admin.access'
      security: *id003
      x-webspace: POST api/admin.php?action=stats
      responses:
        '200':
          description: AdminStats
        '403': *id001
  /api/admin/users:
    get:
      tags:
      - admin
      summary: Benutzerliste mit Filtern und Seiten
      description: 'Berechtigung: users.read'
      security: *id003
      x-webspace: POST api/admin.php?action=users
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: role
        in: query
        schema:
