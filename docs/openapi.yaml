            type:
            - number
            - 'null'
          homeCourseName:
            type:
            - string
            - 'null'
          roundsCount:
            type: integer
          publicRoundsCount:
            type: integer
          rankingPosition:
            type:
            - integer
            - 'null'
          performance:
            type:
            - object
            - 'null'
            description: nur mit Statistik-Freigabe
          isMe:
            type: boolean
    CommunityPage:
      type: object
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
